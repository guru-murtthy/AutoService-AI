version: '3.8'

services:
  database:
    image: postgres:15-alpine
    container_name: autoservice_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: autoservice_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: autoservice_backend
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@database:5432/autoservice_db
      - APP_MODE=development
      - BUSINESS_VALIDATION_MODE=true
      - JWT_SECRET=docker-secret-key-change-me
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: autoservice_worker
    command: python -m app.workers.main
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@database:5432/autoservice_db
      - APP_MODE=development
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: autoservice_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
